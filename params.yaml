study_area:
  name: "Jamuna River Basin - Sirajganj"
  lat_min: 24.0
  lat_max: 25.5
  lon_min: 89.0
  lon_max: 90.5

time_range:
  start: 2000
  end: 2025

feature_sets:
  set_a:
    name: "Runoff Only"
    features:
      - runoff
  set_b:
    name: "Runoff + Weather"
    features:
      - runoff
      - temperature_2m
      - soil_moisture_layer1
  set_c:
    name: "Full Feature Set"
    features:
      - runoff
      - temperature_2m
      - soil_moisture_layer1
      - soil_moisture_layer2
      - wind_u_10m
      - wind_v_10m

xgboost:
  n_estimators: 300
  max_depth: 6
  learning_rate: 0.1
  subsample: 0.8
  colsample_bytree: 0.8
  optuna_trials: 30

lstm:
  hidden_size: 64
  num_layers: 2
  dropout: 0.2
  sequence_length: 14
  batch_size: 32
  epochs: 50
  learning_rate: 0.001
  patience: 15

physics:
  lambda_mono: 0.1
  lambda_corr: 0.1

evaluation:
  holdout_years:
    - 2023
    - 2024
    - 2025
  lead_times:
    - 1
    - 2
    - 3
  cv_strategy: "leave_one_year_out"