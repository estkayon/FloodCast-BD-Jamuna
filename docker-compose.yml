# docker-compose.yml

version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: floodcast-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app/src
      - FLOODCAST_ENV=production
    volumes:
      - model-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: floodcast-dashboard
    ports:
      - "8501:8501"
    environment:
      - PYTHONPATH=/app/src
      - FLOODCAST_API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  model-data: