# render.yaml
# Render.com deployment blueprint

services:
  - type: web
    name: floodcast-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn floodcast.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src/src
      - key: FLOODCAST_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
    healthCheckPath: /health
    plan: free